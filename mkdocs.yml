site_name: Open Specification
site_url: https://open-specification.org
site_description: A standard for defining software in written language.
repo_url: https://github.com/davidgibsonp/open-specification
repo_name: davidgibsonp/open-specification
edit_uri: edit/main/

nav:
  - Home: index.md
  - The Runtime — OPENSPEC.md: openspec.md
  - Writing Guide: writing-guide.md
  - Examples: examples/README.md
  - Contributing: contributing.md
  - Changelog: changelog.md

theme:
  name: material
  palette:
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/davidgibsonp/open-specification

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search



